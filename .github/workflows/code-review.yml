name: AI Code Review

# Automatisk AI-granskning på varje PR. Använder det officiella Claude Code-action:et
# (anthropics/claude-code-action@v1) med code-review-pluginet, som postar fynd som
# inline-kommentarer på de rader där problem hittas — utan att blockera merge.
#
# Förutsättningar (se README "Automatisk AI-granskning"):
#   1. Repo-secret ANTHROPIC_API_KEY satt (Settings → Secrets and variables → Actions).
#   2. (Valfritt) Claude GitHub-appen installerad för @claude-interaktion och snyggare
#      attribution: kör `/install-github-app` i en Claude Code-terminal.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Behörigheter jobbet behöver. id-token: write krävs av action:et för att hämta en
# OIDC-token; de övriga låter det posta granskningen.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# Avbryt en pågående granskning om en ny push kommer på samma PR (sparar tokens).
concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full historik → granskaren ser hela kodbasens kontext

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Installerar code-review-pluginet från Anthropics marketplace och kör dess skill.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Default-modell är Sonnet. Avkommentera för Opus (starkare granskning, dyrare):
          # claude_args: "--model claude-opus-4-8"
